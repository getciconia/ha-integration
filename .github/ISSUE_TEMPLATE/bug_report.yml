name: Bug report
description: Something in the Ciconia integration doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.4"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ciconia integration version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Settings → Devices & services → Ciconia → ⋮ → Download diagnostics, then
        drag the file here. The token and positions are already removed.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything from the log that mentions `ciconia` (enable debug logging first if you can).
      render: text
