[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
# Home Assistant re-exports names from its packages' __init__ (e.g.
# components.device_tracker.TrackerEntity) the way its own integrations use.
implicit_reexport = true
warn_unreachable = true
files = ["custom_components/ciconia"]

[tool.coverage.run]
source = ["custom_components/ciconia"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "LOG", "G", "PL", "D"]
ignore = [
  "D203", "D213",  # pick one docstring layout (D211/D212, like Home Assistant)
  "PLR2004",       # magic values read fine in tests and signal bands
  "PLR0913",
  "D401",          # docstrings describe ("The server address ...") rather than command
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLC0415"]
"dev/**" = ["D", "PL", "E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
